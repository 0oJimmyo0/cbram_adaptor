adapter_weight_decay: 0.05
input_scale_divisor: 1.0
selection_metric: cohen_kappa
dropout: 0.1
label_smoothing: 0.1
clip_grad: 1.0
adapter_bottleneck: 64
adapter_heads: 4
adapter_zero_init_output: true
